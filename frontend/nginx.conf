# nginx config for the NIM Research frontend container.
#
# Two responsibilities:
#   1. Serve the React SPA assets from /usr/share/nginx/html with HTML5
#      history-mode fallback (any unknown path → index.html so React Router
#      handles it).
#   2. Reverse-proxy /api/* to the backend service so the SPA can use
#      relative URLs and the same image runs in dev / staging / prod.

server {
    listen 80;
    server_name _;

    # Body limit matches the backend's 50 MB upload cap (PDF / HTML upload
    # endpoints).
    client_max_body_size 60M;

    # Static assets — long cache for hashed JS/CSS, short cache for HTML.
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly. Vite already pre-compresses .br and
    # .gz on disk if configured, but the default build doesn't, so handle it
    # here.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Reverse proxy to the backend service. The container hostname ``backend``
    # resolves through the Compose network. We forward both /api and /docs +
    # /openapi.json so the Swagger UI works through the same origin.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts for slow research / synthesis pipelines that can
        # stream progress over a single request. The actual long-running
        # work happens in background tasks; these timeouts only matter for
        # initial dispatch.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    # Hashed assets — cache forever.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. Anything not matched above falls back to index.html so
    # React Router can render the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
